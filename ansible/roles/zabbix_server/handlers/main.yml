---
- name: Generate locales
  ansible.builtin.command: locale-gen
  changed_when: true
  notify: Restart php-fpm

- name: Restart zabbix-server
  ansible.builtin.service:
    name: zabbix-server
    state: restarted

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: restarted

- name: Restart php-fpm
  ansible.builtin.service:
    name: "php{{ zabbix_php_version }}-fpm"
    state: restarted
