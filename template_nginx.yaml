---
zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e2dd821970d54f26b8c003ca02964503
      name: Templates/Diplom
  templates:
    - uuid: f32eb9ce22f84d0d8985cfdeb96bc92d
      template: Diplom nginx
      name: Diplom nginx
      description: stub_status nginx (на основе Nginx by Zabbix agent active, без обнаружения процессов) и ошибки HTTP по access.log
      groups:
        - name: Templates/Diplom
      items:
        - uuid: 90e04017941e4ead9ee050cde6008a2c
          name: Service response time
          type: ZABBIX_ACTIVE
          key: 'net.tcp.service.perf[http,"{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PORT}"]'
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: application
            - tag: component
              value: health
        - uuid: a382b20aa8b74c829063e6ceba89397e
          name: Service status
          type: ZABBIX_ACTIVE
          key: 'net.tcp.service[http,"{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PORT}"]'
          valuemap:
            name: Service state
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 10m
          tags:
            - tag: component
              value: application
            - tag: component
              value: health
        - uuid: 267c65a0fda14932a6ce2a091b3a5817
          name: Connections accepted per second
          type: DEPENDENT
          key: nginx.connections.accepted.rate
          delay: '0'
          value_type: FLOAT
          description: The total number of accepted client connections.
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s+([0-9]+) ([0-9]+) ([0-9]+)'
                - '\1'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: connections
        - uuid: 3d7122a8fd6a4538a8f62a43651a9b14
          name: Connections active
          type: DEPENDENT
          key: nginx.connections.active
          delay: '0'
          description: The current number of active client connections including waiting connections.
          preprocessing:
            - type: REGEX
              parameters:
                - 'Active connections: ([0-9]+)'
                - '\1'
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: connections
        - uuid: 1d71c9fa758f49479b947e2ea0b1db69
          name: Connections dropped per second
          type: DEPENDENT
          key: nginx.connections.dropped.rate
          delay: '0'
          value_type: FLOAT
          description: The total number of dropped client connections.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var a = value.match(/server accepts handled requests\\s+([0-9]+) ([0-9]+) ([0-9]+)/)\nif (a) {\n\treturn a[1]-a[2]\n}\n"
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: connections
        - uuid: 8f6afff835fe4cb594a77cbdb5c0857a
          name: Connections handled per second
          type: DEPENDENT
          key: nginx.connections.handled.rate
          delay: '0'
          value_type: FLOAT
          description: The total number of handled connections. Generally, the parameter value is the same as for the accepted connections, unless some resource limits have been reached (for example, the `worker_connections limit`).
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s+([0-9]+) ([0-9]+) ([0-9]+)'
                - '\2'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: connections
        - uuid: d206fc10cd93434f901be071d3682449
          name: Connections reading
          type: DEPENDENT
          key: nginx.connections.reading
          delay: '0'
          description: The current number of connections where Nginx is reading the request header.
          preprocessing:
            - type: REGEX
              parameters:
                - 'Reading: ([0-9]+) Writing: ([0-9]+) Waiting: ([0-9]+)'
                - '\1'
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: connections
        - uuid: 43183e8d06f74c15915ed4b5b228ff94
          name: Connections waiting
          type: DEPENDENT
          key: nginx.connections.waiting
          delay: '0'
          description: The current number of idle client connections waiting for a request.
          preprocessing:
            - type: REGEX
              parameters:
                - 'Reading: ([0-9]+) Writing: ([0-9]+) Waiting: ([0-9]+)'
                - '\3'
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: connections
        - uuid: 7c9c758452074d958c66b15181311741
          name: Connections writing
          type: DEPENDENT
          key: nginx.connections.writing
          delay: '0'
          description: The current number of connections where Nginx is writing a response back to the client.
          preprocessing:
            - type: REGEX
              parameters:
                - 'Reading: ([0-9]+) Writing: ([0-9]+) Waiting: ([0-9]+)'
                - '\2'
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: connections
        - uuid: 046980e800e74b31aa3022ec6077d6ab
          name: Requests total
          type: DEPENDENT
          key: nginx.requests.total
          delay: '0'
          description: The total number of client requests.
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s+([0-9]+) ([0-9]+) ([0-9]+)'
                - '\3'
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: requests
        - uuid: 90a1d109f5ac460392019909139e5304
          name: Requests per second
          type: DEPENDENT
          key: nginx.requests.total.rate
          delay: '0'
          value_type: FLOAT
          description: The total number of client requests.
          preprocessing:
            - type: REGEX
              parameters:
                - 'server accepts handled requests\s+([0-9]+) ([0-9]+) ([0-9]+)'
                - '\3'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: requests
        - uuid: 4ae1bd1015b44bbbaaa60ba09be9b8ce
          name: Version
          type: DEPENDENT
          key: nginx.version
          delay: '0'
          value_type: CHAR
          trends: '0'
          preprocessing:
            - type: REGEX
              parameters:
                - '(?i)Server: nginx\/(.+(?<!\r))'
                - '\1'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          tags:
            - tag: component
              value: application
          triggers:
            - uuid: 3c864fe39d4b411a982953c58dfb2e1d
              expression: 'last(/Diplom nginx/nginx.version,#1)<>last(/Diplom nginx/nginx.version,#2) and length(last(/Diplom nginx/nginx.version))>0'
              name: 'Nginx: Version has changed'
              event_name: 'Nginx: Version has changed (new version: {ITEM.VALUE})'
              priority: INFO
              description: The Nginx version has changed. Acknowledge to close the problem manually.
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: notice
        - uuid: 173a0372ccd8480b92471115a4811afa
          name: Get stub status page
          type: ZABBIX_ACTIVE
          key: 'web.page.get["{$NGINX.STUB_STATUS.HOST}","{$NGINX.STUB_STATUS.PATH}","{$NGINX.STUB_STATUS.PORT}"]'
          history: 1h
          value_type: TEXT
          trends: '0'
          description: 'The following status information is provided:

            `Active connections` - the current number of active client connections including waiting connections.

            `Accepted` - the total number of accepted client connections.

            `Handled` - the total number of handled connections. Generally, the parameter value is the same as for the accepted connections, unless some resource limits have been reached (for example, the `worker_connections` limit).

            `Requests` - the total number of client requests.

            `Reading` - the current number of connections where Nginx is reading the request header.

            `Writing` - the current number of connections where Nginx is writing a response back to the client.

            `Waiting` - the current number of idle client connections waiting for a request.


            See also [Module ngx_http_stub_status_module](https://nginx.org/en/docs/http/ngx_http_stub_status_module.html).

            '
          tags:
            - tag: component
              value: application
            - tag: component
              value: health
        - uuid: f0f8053ef6374328ab6eb6ca89a8b727
          name: HTTP 5xx per minute
          type: ZABBIX_ACTIVE
          key: 'log.count[/var/log/nginx/access.log,"\" 5[0-9]{2} ",,,skip]'
          delay: 1m
          history: 7d
          units: rpm
          tags:
            - tag: component
              value: http
          triggers:
            - uuid: 6c5e17920ff4478c8e25dfcdd940fc45
              expression: 'min(/Diplom nginx/log.count[/var/log/nginx/access.log,"\" 5[0-9]{2} ",,,skip],3m)>10'
              name: 'Nginx: много ответов 5xx на {HOST.NAME}'
              priority: AVERAGE
        - uuid: 800b8b98119342baaf0fcda93c582aff
          name: HTTP 4xx per minute
          type: ZABBIX_ACTIVE
          key: 'log.count[/var/log/nginx/access.log,"\" 4[0-9]{2} ",,,skip]'
          delay: 1m
          history: 7d
          units: rpm
          tags:
            - tag: component
              value: http
          triggers:
            - uuid: fb8aab6d2b064fc4b966b92187ae6c27
              expression: 'min(/Diplom nginx/log.count[/var/log/nginx/access.log,"\" 4[0-9]{2} ",,,skip],3m)>60'
              name: 'Nginx: много ответов 4xx на {HOST.NAME}'
              priority: WARNING
        - uuid: 1f3006a78e074a5a8559a4b67c74d45f
          name: HTTP requests per minute (access.log)
          type: ZABBIX_ACTIVE
          key: 'log.count[/var/log/nginx/access.log,,,,skip]'
          delay: 1m
          history: 7d
          units: rpm
          tags:
            - tag: component
              value: http
        - uuid: f22bce675b7f4719a7c6f62b6bdae537
          name: HTTP 5xx share
          type: CALCULATED
          key: http.5xx.share
          delay: 1m
          history: 7d
          value_type: FLOAT
          units: '%'
          params: 'last(//log.count[/var/log/nginx/access.log,"\" 5[0-9]{2} ",,,skip])/(last(//log.count[/var/log/nginx/access.log,,,,skip])+0.0001)*100'
          tags:
            - tag: component
              value: http
          triggers:
            - uuid: 1403adba70b549f89758d4419f73abd3
              expression: min(/Diplom nginx/http.5xx.share,5m)>5
              name: 'Nginx: доля 5xx выше 5% на {HOST.NAME}'
              priority: HIGH
      macros:
        - macro: '{$NGINX.DROP_RATE.MAX.WARN}'
          value: '1'
          description: The critical rate of the dropped connections for a trigger expression.
        - macro: '{$NGINX.RESPONSE_TIME.MAX.WARN}'
          value: '10'
          description: The maximum response time of Nginx expressed in seconds for a trigger expression.
        - macro: '{$NGINX.STUB_STATUS.HOST}'
          value: localhost
          description: The hostname or IP address of the Nginx host or Nginx container of `astub_status`.
        - macro: '{$NGINX.STUB_STATUS.PATH}'
          value: basic_status
          description: The path of the `Nginx stub_status` page.
        - macro: '{$NGINX.STUB_STATUS.PORT}'
          value: '80'
          description: The port of the `Nginx stub_status` host or container.
      valuemaps:
        - uuid: c1fb0cc84c7a41268ad3feba3e7f3fc3
          name: Service state
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up
      tags:
        - tag: class
          value: software
        - tag: target
          value: nginx
